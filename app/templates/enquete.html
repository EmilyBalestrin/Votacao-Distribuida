
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votação Distribuída</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #263244;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin: 10px 0 18px;
            font-size: 15px;
        }

        .opcao {
            display: block;
            margin: 14px 0;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 7px;
            cursor: pointer;
        }

        .opcao:hover {
            background: #f8fafc;
        }

        button {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 13px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 15px;
            font-weight: bold;
        }

        .resultado {
            margin: 18px 0;
        }

        .linha {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .barra {
            background: #e2e8f0;
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
        }

        .preenchimento {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.3s;
        }

        .rodape {
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }


.status-votacao {
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.5;
}

.status-votacao.verificando {
    background: #f1f5f9;
    color: #475569;
}

.status-votacao.disponivel {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
}

.status-votacao.suspensa {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
}
    </style>
</head>

<body>
    <div class="container">
        <h1>Sistema de Votação Distribuída</h1>
        <p class="subtitulo">
            Escolha sua linguagem de programação favorita!
        </p>

       <div class="card">
            <h2>Registrar voto</h2>

        <div id="statusVotacao"
            class="status-votacao verificando"
            role="status"
            aria-live="polite">
            Verificando disponibilidade da votação...
        </div>

        <form id="formVotacao">
                <label for="eleitor">Identificador do eleitor:</label>

                <input
                    type="text"
                    id="eleitor"
                    placeholder="Ex.: eleitor001"
                    required
                >

                <p>Selecione uma opção:</p>

                <label class="opcao">
                    <input type="radio" name="opcao" value="python" required>
                    Python
                </label>

                <label class="opcao">
                    <input type="radio" name="opcao" value="java">
                    Java
                </label>

                <label class="opcao">
                    <input type="radio" name="opcao" value="javascript">
                    JavaScript
                </label>

               <button type="submit" id="botaoVotar" disabled>
                   Verificando disponibilidade...
                </button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </div>

        <div class="card">
            <h2>Resultados da votação</h2>

            <p>
                Total de votos:
                <strong id="totalVotos">0</strong>
            </p>

            <div class="resultado">
                <div class="linha">
                    <span>Python</span>
                    <span id="votosPython">0</span>
                </div>
                <div class="barra">
                    <div class="preenchimento" id="barraPython"></div>
                </div>
            </div>

            <div class="resultado">
                <div class="linha">
                    <span>Java</span>
                    <span id="votosJava">0</span>
                </div>
                <div class="barra">
                    <div class="preenchimento" id="barraJava"></div>
                </div>
            </div>

            <div class="resultado">
                <div class="linha">
                    <span>JavaScript</span>
                    <span id="votosJavaScript">0</span>
                </div>
                <div class="barra">
                    <div class="preenchimento" id="barraJavaScript"></div>
                </div>
            </div>

            <button type="button" onclick="carregarResultados()">
                Atualizar resultados
            </button>
        </div>

        <p class="rodape">
            Projeto acadêmico de Sistemas Distribuídos
        </p>
    </div>


<script>
    const formulario = document.getElementById("formVotacao");
    const mensagem = document.getElementById("mensagem");
    const botaoVotar = document.getElementById("botaoVotar");
    const statusVotacao = document.getElementById("statusVotacao");

    let votacaoDisponivel = false;
    let votacaoEmAndamento = false;

    // Atualiza a mensagem e o botao da interface

function atualizarInterface(disponivel, texto) {
    votacaoDisponivel = disponivel;

    botaoVotar.disabled = !disponivel || votacaoEmAndamento;

    if (disponivel) {
        // Votacao funcionando normalmente
        botaoVotar.textContent = "Registrar voto";

        // Esconde a mensagem de disponibilidade
        statusVotacao.style.display = "none";

    } else {
        // Votacao temporariamente suspensa
        botaoVotar.textContent = "Votação indisponível";

        statusVotacao.style.display = "block";
        statusVotacao.className = "status-votacao suspensa";
        statusVotacao.textContent = texto;
    }
}

    // Consulta a disponibilidade dos servidores
    async function verificarDisponibilidade() {
        try {
            const resposta = await fetch("/votacao/quorum", {
                cache: "no-store",
                signal: AbortSignal.timeout(8000)
            });

            if (!resposta.ok) {
                throw new Error("Falha ao consultar quorum");
            }

            const dados = await resposta.json();

            const disponivel = (
                dados.quorum_disponivel === true &&
                [1, 2, 3].includes(dados.lider_conhecido)
            );

            if (disponivel) {
                atualizarInterface(
                    true,
                    "Votação disponível. " +
                    dados.nos_ativos.length +
                    " de " + dados.total_nos +
                    " servidores ativos."
                );
            } else {
                atualizarInterface(
                    false,
                    "Votação temporariamente suspensa. " +
                    "Não há servidores suficientes ou " +
                    "a liderança está indisponível. " +
                    "Aguarde a recuperação do sistema."
                );
            }

        } catch (erro) {
            atualizarInterface(
                false,
                "Não foi possível verificar a disponibilidade. " +
                "A votação ficará suspensa até que " +
                "a comunicação seja restabelecida."
            );
        }
    }

    // Verificacao periodica, sem sobrepor requisicoes
    async function monitorarDisponibilidade() {
        await verificarDisponibilidade();

        setTimeout(monitorarDisponibilidade, 5000);
    }

    // Envio do voto
    formulario.addEventListener("submit", async function(evento) {
        evento.preventDefault();

        if (!votacaoDisponivel || votacaoEmAndamento) {
            return;
        }

        const eleitor = document.getElementById("eleitor").value.trim();
        const selecionada = document.querySelector(
            'input[name="opcao"]:checked'
        );

        if (!eleitor || !selecionada) {
            mensagem.textContent = "Preencha todos os campos.";
            mensagem.style.color = "#b91c1c";
            return;
        }

        votacaoEmAndamento = true;
        botaoVotar.disabled = true;
        botaoVotar.textContent = "Enviando voto...";

        mensagem.textContent = "";

        try {
            const resposta = await fetch("/votar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    eleitor: eleitor,
                    opcao: selecionada.value
                })
            });

            const dados = await resposta.json();

            if (resposta.ok && dados.voto_confirmado === true) {
                mensagem.textContent = "Voto confirmado com sucesso!";
                mensagem.style.color = "green";

                formulario.reset();
                await carregarResultados();
            } else {
                mensagem.textContent =
                    dados.erro ||
                    dados.mensagem ||
                    "Não foi possível confirmar o voto.";

                mensagem.style.color = "#b45309";
            }

        } catch (erro) {
            mensagem.textContent =
                "Erro de comunicação. Consulte o estado " +
                "do voto antes de tentar novamente.";

            mensagem.style.color = "#b91c1c";

        } finally {
            votacaoEmAndamento = false;

            botaoVotar.disabled = !votacaoDisponivel;

            botaoVotar.textContent = votacaoDisponivel
                ? "Registrar voto"
                : "Votação indisponível";
        }
    });

    // Consulta os resultados
    async function carregarResultados() {
        try {
            const resposta = await fetch("/resultados", {
                cache: "no-store"
            });

            if (!resposta.ok) {
                throw new Error("Erro ao consultar resultados");
            }

            const dados = await resposta.json();
            const total = dados.total_votos;
            const resultados = dados.resultados;

            document.getElementById("totalVotos").textContent = total;

            atualizarBarra("Python", resultados.python, total);
            atualizarBarra("Java", resultados.java, total);
            atualizarBarra("JavaScript", resultados.javascript, total);

        } catch (erro) {
            console.error("Erro ao carregar resultados:", erro);
        }
    }

    function atualizarBarra(nome, quantidade, total) {
        const percentual = total > 0
            ? (quantidade / total) * 100
            : 0;

        document.getElementById(
            "votos" + nome
        ).textContent = quantidade;

        document.getElementById(
            "barra" + nome
        ).style.width = percentual + "%";
    }

    // Inicia as consultas
    carregarResultados();
    monitorarDisponibilidade();

    // Atualiza resultados periodicamente
    setInterval(carregarResultados, 10000);
</script>
</body>
</html>
